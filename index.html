<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="เกม RPG พิกเซล 2.5D แนวฮันเตอร์ปลุกพลัง สร้างตัวละครเอง สุ่มอาชีพและสกิล ตื่นรู้ และบริหารสตามินารายวัน">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ผู้ปลุกพลัง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one-column "system window" console — status HUD, tabs, panel; a gate run swaps the panel for a lit 2.5D pixel arena */
:root{
  --bg:#050913; --panel:#0a1324; --panel2:#0e1a31; --line:#1f4f86; --glow:#58c4ff;
  --text:#d6e9ff; --mute:#7890b0; --danger:#ff5470; --gold:#ffc85a; --violet:#a37bff; --ok:#4fdc9b;
  --rc:#9fb4cf; --ink:#02050c; --crimson:#ff5a7a; --sun:#ffe27a; --glitch:#ff4fd8; --cyan:#4ff3ff;
  --disp:'Chakra Petch','IBM Plex Sans Thai',system-ui,sans-serif;
  --body:'IBM Plex Sans Thai','Chakra Petch',system-ui,sans-serif;
  color-scheme:dark;
}
html{background:var(--bg)}
body{background:radial-gradient(ellipse 90% 50% at 50% -10%,#0f2a4d 0%,transparent 70%),var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;padding:0 16px 48px;min-height:100vh}
#app{max-width:900px;margin:0 auto;display:grid;gap:16px;padding-top:16px}
h1,h2,h3{font-family:var(--disp);text-wrap:balance;margin:0}
p{margin:0}
.win{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(88,196,255,.06),0 0 28px rgba(88,196,255,.10);padding:16px}
.win::before,.win::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--glow);pointer-events:none;z-index:2}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.eyebrow,.lbl{font-family:var(--disp);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.small,.hint{font-size:13px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pt{image-rendering:pixelated;max-width:100%;display:block}

.btn{font-family:var(--disp);font-size:15px;font-weight:600;background:transparent;color:var(--glow);border:1px solid var(--glow);padding:9px 16px;cursor:pointer;letter-spacing:.03em;transition:background .15s,color .15s,box-shadow .15s}
.btn:hover:not(:disabled){background:rgba(88,196,255,.12);box-shadow:0 0 14px rgba(88,196,255,.35)}
.btn:focus-visible,.tab:focus-visible,.pick:focus-visible,.sw:focus-visible,.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.solid{background:var(--glow);color:var(--ink)}
.btn.solid:hover:not(:disabled){background:var(--text)}
.btn.ghost{border-color:var(--line);color:var(--mute)}
.btn.bad{border-color:var(--danger);color:var(--danger)}
.btn.ult{border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(255,200,90,.25)}
.btn.violet{border-color:var(--violet);color:var(--violet);font-size:20px;letter-spacing:.2em}
.btn.violet:hover{background:rgba(163,123,255,.15);box-shadow:0 0 18px rgba(163,123,255,.5)}
.btn.sm{padding:3px 10px;font-size:14px}
.btn small{font-weight:400;opacity:.8;margin-left:6px}

.chip{display:inline-block;font-family:var(--disp);font-weight:700;font-size:12px;line-height:1.5;padding:0 7px;border:1px solid currentColor;color:var(--gc,var(--glow));letter-spacing:.06em;white-space:nowrap}
.chip.bad{color:var(--danger)} .chip.warn{color:var(--gold)} .chip.cy{color:var(--cyan)} .chip.vi{color:var(--violet)} .chip.ok{color:var(--ok)}
.r-C{color:var(--rc)} .r-B{color:var(--ok)} .r-A{color:var(--gold)} .r-S{color:var(--violet);text-shadow:0 0 12px rgba(163,123,255,.6)}
.r-SS{color:var(--crimson);text-shadow:0 0 10px rgba(255,90,122,.55)} .r-SSS{color:var(--sun);text-shadow:0 0 12px rgba(255,226,122,.65)}
.r-X{color:var(--glitch);text-shadow:2px 0 rgba(79,243,255,.7)} .r-U{color:var(--gold);text-shadow:0 0 10px rgba(255,200,90,.6)}
.g-E{--gc:#8aa3c2}.g-D{--gc:#4fd1c5}.g-C{--gc:#5fe08a}.g-B{--gc:#58a8ff}.g-A{--gc:#ffc85a}.g-S{--gc:#ff4f7b}.g-X{--gc:#b48cff}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto auto auto;gap:12px 24px;align-items:end}
.who{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;min-width:0}
.avatar{background:radial-gradient(circle at 50% 75%,rgba(88,196,255,.22),transparent 70%),var(--ink);border:1px solid var(--line);padding:6px 8px;display:grid;place-items:center}
.hud .nm{font-family:var(--disp);font-size:24px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.hud .job{font-family:var(--disp);font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lv,.rkv,.gv{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.rkv{color:var(--gold)} .gv{font-size:22px}
.hud .bars{grid-column:1/-1;display:grid;gap:6px}
@media (max-width:560px){.hud{grid-template-columns:repeat(3,1fr)}.hud .who{grid-column:1/-1}}
.bar-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;font-family:var(--disp);font-size:13px}
.bl{color:var(--mute);letter-spacing:.08em}
.bv{font-variant-numeric:tabular-nums;min-width:84px;text-align:right}
.bar{height:8px;background:var(--ink);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;transition:width .35s ease}
.bar.hp>i{background:linear-gradient(90deg,#c22b48,var(--danger))}
.bar.mp>i{background:linear-gradient(90deg,#2a7cc7,var(--glow))}
.bar.st>i{background:linear-gradient(90deg,#2f9e6a,var(--ok))}
.bar.st.f1>i{background:linear-gradient(90deg,#a8742a,var(--gold))}
.bar.st.f2>i{background:var(--danger)}
.bar.xp>i{background:linear-gradient(90deg,#b8862c,var(--gold))}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font-family:var(--disp);font-size:15px;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:10px 14px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--glow);border-bottom-color:var(--glow)}
.dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;background:var(--danger);color:var(--ink);font-size:11px;line-height:18px;text-align:center}

section.win{display:grid;gap:16px}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.sechead h2{font-size:20px}
.pts{font-family:var(--disp);color:var(--gold);font-weight:600}
.banner{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--gold);padding:10px 14px;color:var(--gold);font-family:var(--disp)}

/* status */
.statgrid{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:620px){.statgrid{grid-template-columns:1fr}}
.showcase{display:grid;place-items:center;min-height:210px;border:1px solid var(--line);background:radial-gradient(ellipse 40% 9% at 50% 90%,rgba(0,0,0,.7),transparent),radial-gradient(circle at 50% 62%,var(--aura,rgba(88,196,255,.22)),transparent 62%),var(--ink)}
.stats{display:grid;gap:4px}
.st{display:grid;grid-template-columns:44px 1fr auto auto auto;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed rgba(31,79,134,.6)}
.st .ab{font-family:var(--disp);font-weight:700;color:var(--mute)}
.st .ab.main{color:var(--glow)}
.st b{font-family:var(--disp);font-size:20px;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.derived{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.derived div{border:1px solid var(--line);padding:8px 10px;min-width:0}
.derived b{display:block;font-family:var(--disp);font-size:20px;font-variant-numeric:tabular-nums}
.trait{border-left:3px solid var(--gold);padding:8px 12px;background:rgba(255,200,90,.05)}
.trait b{font-family:var(--disp);color:var(--gold)}
.trait.aw{border-color:var(--violet);background:rgba(163,123,255,.06)} .trait.aw b{color:var(--violet)}
.skills{display:grid;gap:8px}
.sk{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);background:rgba(88,196,255,.03)}
.sk .chip{text-align:center}
.sk b{font-family:var(--disp)}
.kind{font-family:var(--disp);font-size:11px;letter-spacing:.1em;color:var(--mute);margin-left:6px}

/* schedule */
.stabox{display:grid;gap:10px;border:1px solid var(--line);padding:14px;background:rgba(79,220,155,.04)}
.stabig{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.costs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute)}
.costs b{color:var(--text);font-family:var(--disp)}
.quest{display:grid;grid-template-columns:90px 1fr 90px auto;gap:12px;align-items:center}
.quest .q{font-weight:600}
.quest .n{font-family:var(--disp);font-variant-numeric:tabular-nums;text-align:right}
.quest.done .q{color:var(--ok)}
@media (max-width:480px){.quest{grid-template-columns:1fr auto auto}.quest .bar{grid-column:1/-1;grid-row:2}}
.reward{border:1px solid var(--gold);padding:12px;color:var(--gold);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.warn{color:var(--danger);font-size:13px}
.acts{display:grid;gap:0}
.actrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed rgba(31,79,134,.6)}
.actrow .nm{font-weight:600}

/* gates */
.gates{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:16px}
.gate{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.gate.trial{border-color:#6d4fb8;background:linear-gradient(135deg,rgba(180,140,255,.12),transparent 60%),linear-gradient(180deg,var(--panel2),var(--panel))}
.gate.trial::before,.gate.trial::after{border-color:#b48cff}
.gate.locked{opacity:.65}
.grank{position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font:700 24px var(--disp);color:var(--gc)}
.grank::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--gc),transparent 30%,var(--gc) 50%,transparent 80%,var(--gc));animation:spin 6s linear infinite;box-shadow:0 0 18px var(--gc)}
.grank::after{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,#000 30%,var(--panel) 100%)}
.grank span{position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.gname{font-family:var(--disp);font-weight:700;font-size:18px}
.gmeta{font-size:13px;color:var(--mute)}
.gmeta.ok{color:var(--ok)}
.gact{display:grid;gap:6px;justify-items:end}
@media (max-width:440px){.gate{grid-template-columns:auto 1fr}.gact{grid-column:1/-1;justify-items:stretch;grid-template-columns:auto 1fr;align-items:center}}

/* shop / lists */
.item{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed rgba(31,79,134,.6)}
.item .nm{font-weight:600}
.price{font-family:var(--disp);color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.shrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed rgba(31,79,134,.6)}

/* codex */
.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.cx{display:grid;gap:8px;border:1px solid var(--line);padding:12px;align-content:start;background:rgba(5,9,19,.4)}
.cx.cur{border-color:var(--glow)}
.cxhead{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}
.cxhead .pt{margin:auto}
.cxname{font-family:var(--disp);font-size:18px;font-weight:700}
.pool{font-size:13px;color:var(--mute)}
.pool b{color:var(--text);font-weight:500}

/* battle */
.battle{display:grid;gap:12px}
.bhead{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-family:var(--disp)}
.bhead b{font-size:18px}
.stage-num{color:var(--mute);margin-left:auto}
.stage-wrap{padding:0;overflow:hidden}
.stage{display:block;width:100%;height:300px}
@media (max-width:560px){.stage{height:240px}}
.foe{display:grid;gap:6px;padding:12px 16px}
.foe.boss{border-color:var(--danger)}
.foe.boss::before,.foe.boss::after{border-color:var(--danger)}
.fhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.fname{font-family:var(--disp);font-size:22px;font-weight:700}
.fmeta{font-size:13px;color:var(--mute);font-family:var(--disp)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.note{flex-basis:100%;font-family:var(--disp);color:var(--glow)}
.note.bad{color:var(--danger)}
.roomtext{flex-basis:100%}
.log{display:grid;gap:3px;font-size:14px;min-height:110px;align-content:start}
.l{color:var(--mute)} .l.crit{color:var(--gold);font-weight:600} .l.bad{color:var(--danger)} .l.ok{color:var(--ok)}
.l.sk{color:var(--glow)} .l.sh{color:var(--violet)} .l.warn{color:var(--gold)} .l.sys{color:var(--text);font-family:var(--disp)}
.l:first-child{color:var(--text)}

/* modal + creation */
#modal{position:fixed;inset:0;z-index:20;background:rgba(2,5,12,.86);backdrop-filter:blur(3px);display:flex;padding:16px;overflow:auto}
#modal[hidden]{display:none}
.mwrap{width:min(560px,100%);margin:auto}
.mwrap.wide{width:min(800px,100%)}
.sysbox{display:grid;gap:14px}
.big{font-size:24px;line-height:1.3}
.sysbox label,.flabel{font-size:13px;color:var(--mute);font-family:var(--disp);letter-spacing:.06em}
.sysbox input{font:inherit;font-size:16px;background:var(--ink);color:var(--text);border:1px solid var(--line);padding:10px 12px;width:100%;box-sizing:border-box}
.sysbox input:focus{outline:2px solid var(--glow)}
.rollstage{display:grid;place-items:center;min-height:170px;background:radial-gradient(ellipse 30% 8% at 50% 88%,rgba(0,0,0,.7),transparent),radial-gradient(circle at 50% 60%,rgba(88,196,255,.2),transparent 65%)}
.create{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:18px;align-items:start}
.create>.fgroup{align-content:start}
@media (max-width:640px){.create{grid-template-columns:1fr}}
.create .rollstage{min-height:260px;border:1px solid var(--line);background-color:var(--ink)}
.fgroup{display:grid;gap:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font-family:var(--disp);font-size:14px;background:transparent;color:var(--mute);border:1px solid var(--line);padding:4px 12px;cursor:pointer}
.opt.on{color:var(--ink);background:var(--glow);border-color:var(--glow)}
.sw{width:30px;height:30px;border:2px solid var(--line);background:var(--c);cursor:pointer;padding:0}
.sw.on{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--ink)}
.origins{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px}
.slot{font-family:var(--disp);font-size:36px;font-weight:700;text-align:center;padding:12px 0;border-block:1px solid var(--line)}
.glitch{animation:glitch .22s steps(2) infinite}
@keyframes glitch{0%{transform:translate(0)}50%{transform:translate(-2px,1px);text-shadow:2px 0 var(--cyan),-2px 0 var(--glitch)}100%{transform:translate(2px,-1px)}}
.odds{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-family:var(--disp);justify-content:center}
.clsres{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.rar{font:700 44px/1 var(--disp)}
.cname{font-family:var(--disp);font-size:30px;font-weight:700}
.basest{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--disp);color:var(--mute)}
.basest b{color:var(--text)}
.picks{display:grid;gap:10px}
.pick{all:unset;box-sizing:border-box;display:grid;gap:4px;padding:12px 14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--text)}
.pick:hover{border-color:var(--glow);box-shadow:0 0 16px rgba(88,196,255,.3)}
.pick.on{border-color:var(--gold);box-shadow:0 0 14px rgba(255,200,90,.25)}
.pick b{font-family:var(--disp);font-size:16px}
.transform{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;justify-items:center}
.transform .arrow{font:700 28px var(--disp);color:var(--violet)}
.arise-big{font:700 clamp(48px,14vw,88px)/1 var(--disp);color:var(--violet);text-align:center;letter-spacing:.12em;text-shadow:0 0 30px var(--violet);animation:rise .9s ease-out}
.arise-big.gold{color:var(--gold);text-shadow:0 0 30px var(--gold);font-size:clamp(36px,10vw,64px)}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.9);letter-spacing:.5em}to{opacity:1}}

/* toasts */
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;display:grid;gap:6px;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--glow);padding:10px 14px;font-size:14px;box-shadow:0 0 20px rgba(88,196,255,.35);animation:tin .25s}
.toast span{font-family:var(--disp);color:var(--glow);font-weight:600}
.toast.lv{border-color:var(--gold)} .toast.lv span{color:var(--gold)}
.toast.bad{border-color:var(--danger)} .toast.bad span{color:var(--danger)}
.toast.sh{border-color:var(--violet)} .toast.sh span{color:var(--violet)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="toasts" aria-live="polite"></div>
<main id="app"></main>
<div id="modal" hidden></div>

<script>
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rf=(a,b)=>Math.random()*(b-a)+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>String(Math.round(n*10)/10);
const KEY='arise-save-v3';

/* ================= EFFECT KEYS ================= */
const KT={atkp:'ATK +{v}%',defp:'DEF +{v}%',crit:'คริติคอล +{v}%',critdmg:'ดาเมจคริติคอล +{v}%',dodge:'หลบหลีก +{v}%',regen:'ฟื้น HP {v}% ทุกเทิร์น',

function hexRGB(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]}
function toHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function shade(h,f){const [r,g,b]=hexRGB(h);return toHex(r*f,g*f,b*f)}
function hexA(h,a){const [r,g,b]=hexRGB(h);return `rgba(${r},${g},${b},${a})`}
function lum(h){const [r,g,b]=hexRGB(h);return (r*.3+g*.59+b*.11)/255}
function vcol(h,ch,v){
  if(v==='flash')return '#ffffff';
  if(v==='sil')return '#070a12';
  const l=lum(h);
  if(v==='shadow')return ch==='e'?'#e0c8ff':toHex(18+l*70,8+l*40,40+l*120);
  if(v==='gray'){const q=60+l*150;return toHex(q,q,q+14)}
  return h;
}

function artFor(k,id){
  if(k==='me'){const [cid,aw,hair,hc,skin,eye]=id.split('|'),c=CLASSES.find(x=>x.id===cid),A1=c&&aw==='1';
    const pal={...(c?c.art[1]:PLAIN),...(A1?c.aw.pal:{}),h:HC[+hc],s:SKIN[+skin]};

function gridOf(art){

/* sprite pipeline: extruded side (2.5D depth) → shaded front face lit from top-left → crisp outline (glowing when awakened) */
const SC=new Map();
function getSprite(k,id,px,v='n',flip=false){
  const key=[k,id,px,v,flip?1:0].join('|');if(SC.has(key))return SC.get(key);
  const art=artFor(k,id);let g=gridOf(art);if(flip)g=g.map(r=>[...r].reverse());
  const pal={...DEFPAL,...art.pal},H=g.length,W=g[0].length,dep=Math.max(1,Math.round(px*.5)),o=Math.max(1,Math.round(px/3));
  const b=document.createElement('canvas');b.width=W*px+dep;b.height=H*px+dep;const x=b.getContext('2d');
  const col=ch=>vcol(pal[ch]||'#ff00ff',ch,v),F=(i,j)=>j>=0&&j<H&&i>=0&&i<W&&g[j][i]!=='.';
  for(let k2=dep;k2>=1;k2--)for(let j=0;j<H;j++)for(let i=0;i<W;i++){if(!F(i,j))continue;x.fillStyle=shade(col(g[j][i]),.32+.16*(dep-k2)/dep);x.fillRect(i*px+k2,j*px+dep-k2,px,px)}
  const e=Math.max(1,px>>2),shadeOn=v==='n'||v==='shadow'||v==='gray';
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){if(!F(i,j))continue;let cc=col(g[j][i]);
    if(shadeOn){let f=1.08-.16*j/H;const lit=!F(i,j-1)||!F(i-1,j),dk=!F(i+1,j)||!F(i,j+1);if(lit&&!dk)f*=1.14;else if(dk&&!lit)f*=.84;cc=shade(cc,f)}
    x.fillStyle=cc;x.fillRect(i*px,j*px+dep,px,px);
    if(!F(i,j-1)){x.fillStyle=shade(cc,1.32);x.fillRect(i*px,j*px+dep,px,e)}
    if(g[j][i]==='e'&&v==='n'&&px>=4){x.fillStyle='rgba(255,255,255,.8)';x.fillRect(i*px,j*px+dep,e,e)}}
  const out=document.createElement('canvas');out.width=b.width+o*2;out.height=b.height+o*2;const ox=out.getContext('2d');
  const sil=document.createElement('canvas');sil.width=out.width;sil.height=out.height;const sx=sil.getContext('2d');
  sx.drawImage(b,o,o);sx.globalCompositeOperation='source-in';sx.fillStyle=v==='shadow'?'#120a24':v==='sil'?'#000000':(art.glow&&v==='n'?art.glow:'#03050b');sx.fillRect(0,0,sil.width,sil.height);
  for(const[dx,dy]of[[-o,0],[o,0],[0,-o],[0,o],[-o,-o],[o,o],[-o,o],[o,-o]])ox.drawImage(sil,dx,dy);
  ox.drawImage(b,o,o);
  SC.set(key,out);return out;
}
function paintOne(cv,k,id,px,v='n',flip=false){if(!cv)return;const img=getSprite(k,id,px,v,flip);cv.width=img.width;cv.height=img.height;const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);x.drawImage(img,0,0)}

  A.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life-=p.dec;x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.col;x.fillRect(Math.round(p.x),Math.round(p.y),p.sz,p.sz)});x.restore();
  A.nums=A.nums.filter(n=>now-n.t<950);x.textAlign='center';
  A.nums.forEach(n=>{const k=(now-n.t)/950,yy=n.y-k*44;x.globalAlpha=1-k*k;x.font=`700 ${n.big?26:18}px "Chakra Petch",sans-serif`;x.lineWidth=4;x.strokeStyle='#02050c';x.strokeText(n.text,n.x,yy);x.fillStyle=n.col;x.fillText(n.text,n.x,yy)});
  x.globalAlpha=1;
  if(now-A.flash<90){x.fillStyle=`rgba(255,255,255,${.22*(1-(now-A.flash)/90)})`;x.fillRect(-6,-6,W+12,H+12)}
  x.restore();
}
function play(ev,done){
  let t=0,ph=false;const now=()=>performance.now(),P=()=>({x:A.p.cx,y:A.p.cy}),E=()=>({x:A.e.cx,y:A.e.cy});
  const at=f=>setTimeout(f,t),enemyPhase=()=>{if(!ph){ph=true;t+=200}};
  for(const v of ev){switch(v.t){
    case 'patk':at(()=>A.p.lunge=now());t+=120;break;
    case 'skill':at(()=>{addFx('ring',P(),v.col,true);burst(P(),v.col,18,true);num(P(),v.name,v.col)});t+=230;break;
    case 'dmg':at(()=>{A.e.flash=now();addFx('slash',E(),v.crit?'#ffc85a':(v.col||'#bfe9ff'),v.crit,1);if(v.crit)A.flash=now();num(E(),v.v,v.crit?'#ffc85a':(v.col||'#ffffff'),v.crit);burst(E(),v.col||'#ffffff',v.crit?14:7)});t+=160;break;
    case 'sdmg':{const i=v.i;at(()=>{A.sh[i]=now()});t+=110;at(()=>{A.e.flash=now();addFx('slash',E(),'#a37bff',false,1);num(E(),v.v,'#c9a6ff');burst(E(),'#a37bff',6)});t+=60;break}
    case 'heal':at(()=>{addFx('ring',P(),'#4fdc9b',false);num(P(),'+'+v.v,'#4fdc9b');burst(P(),'#4fdc9b',10,true)});t+=150;break;
    case 'pself':at(()=>{A.p.flash=now();num(P(),'-'+v.v,'#ff5470')});t+=150;break;
    case 'kill':at(()=>{A.e.dead=now();addFx('ring',E(),'#ffffff',true);burst(E(),'#ffffff',26)});t+=320;break;
    case 'burn':enemyPhase();at(()=>{A.e.flash=now();num(E(),v.v,'#ff8a3d');burst(E(),'#ff8a3d',10,true)});t+=180;break;
    case 'frozen':enemyPhase();at(()=>{num(E(),'หยุดนิ่ง','#7fe7ff');addFx('ring',E(),'#7fe7ff',false)});t+=260;break;
    case 'extra':at(()=>{num(P(),'เล่นต่อ!','#7fe7ff',true);addFx('ring',P(),'#7fe7ff',true)});t+=260;break;
    case 'eatk':enemyPhase();at(()=>{A.e.lunge=now();if(v.heavy){A.shake=now();burst(E(),'#ff5470',18)}});t+=130;break;
    case 'pdmg':at(()=>{A.p.flash=now();addFx('slash',P(),'#ff5470',v.heavy,-1);num(P(),'-'+v.v,'#ff5470',v.heavy);if(v.heavy)A.shake=now()});t+=200;break;
    case 'miss':at(()=>num(P(),'MISS','#7fe7ff'));t+=180;break;
    case 'undying':at(()=>{num(P(),'ไม่ยอมตาย!','#5ff2ff',true);addFx('ring',P(),'#5ff2ff',true);burst(P(),'#5ff2ff',24,true)});t+=320;break;
    case 'pdie':at(()=>A.p.dead=now());t+=500;break;
  }}
  setTimeout(done,t+80);
}
let EV=[];const emit=o=>EV.push(o);
function runAnim(after){
  ui.busy=true;document.querySelectorAll('.actions .btn').forEach(b=>b.disabled=true);const ev=EV;EV=[];
  const fin=()=>{ui.busy=false;render();after&&after()};
  if(!A.cv||!A.cv.isConnected||!ev.length)return fin();

/* ================= BATTLE ================= */
function mkEnemy(gi,type){
  const g=GATES[gi],af=AFX[S.run.affix];let lv=type==='trial'?Math.max(g.lv,S.lv+2):g.lv+rnd(0,3)+(type==='boss'?2:type==='mob'?0:1);
  let hp=24+lv*12+lv*lv*.35,a=3+lv*2.2+lv*lv*.04,xp=10+lv*6,gold=6+lv*3,name=type==='boss'||type==='trial'?g.boss:type==='mimic'?'มิมิค':pick(g.mobs);
  if(type==='boss'){hp*=2.2;a*=1.2;xp*=4;gold*=5}
  if(type==='trial'){hp*=3;a*=1.25;xp*=6;gold*=6}
  if(type==='elite'){hp*=1.6;a*=1.3;xp*=2.2;gold*=2.5;name='ยอดฝีมือ·'+name}
  if(type==='mimic'){hp*=1.3;a*=1.2;xp*=2;gold*=4}
  hp*=af.hp||1;a*=af.atk||1;
  return {name,lv,hp:Math.round(hp),max:Math.round(hp),atk:Math.round(a),def:Math.floor(lv*.9),xp:Math.round(xp),gold:Math.round(gold),boss:type==='boss'||type==='trial',elite:type==='elite'||type==='mimic',turn:0,burn:0};
}
function log(t,k=''){S.run.log.push({t,k});if(S.run.log.length>30)S.run.log.shift()}
function rollAffix(){let r=Math.random()*100;for(const[k,v]of Object.entries(AFX)){r-=v.w;if(r<0)return k}return 'none'}
function initFight(e){const r=S.run;r.guard=pv('startguard');const w=pv('enemyweak');if(w){e.atk=Math.round(e.atk*(1-w/100))}}
function enter(gi){
  gi=+gi;const g=GATES[gi],cost=staCost(g.sta);

  S.sta-=cost;resetArena();
  S.run={g:gi,stage:g.trial?3:0,enemy:null,obj:null,room:null,guard:0,stop:0,evade:0,buff:null,state:'fight',log:[],loot:{xp:0,gold:0},tries:3,affix:g.trial?'none':rollAffix(),undyingLeft:pv('undying'),lsAcc:0};
  const af=AFX[S.run.affix];log(`[ระบบ] คุณได้เข้าสู่${g.trial?'':'ดันเจี้ยน '}${g.name} (สตามินา -${cost})`,'sys');if(S.run.affix!=='none')log(`[ระบบ] ตรวจพบความผิดปกติ: ${af.n} (${af.d})`,'warn');
  if(g.trial)log('[ภารกิจเปลี่ยนอาชีพ] เอาชนะผู้คุมบททดสอบเพื่อตื่นรู้','warn');
  startRoom();save();render();
}
function startRoom(){
  const r=S.run,g=GATES[r.g];r.stop=0;r.evade=0;r.buff=null;r.obj=null;r.room=null;r.enemy=null;r.guard=0;

  const roll=Math.random()*100;
  if(roll<60){r.enemy=mkEnemy(r.g,'mob');r.state='fight';initFight(r.enemy);log(`${r.enemy.name} ปรากฏตัว!`);return}
  if(roll<74){r.enemy=mkEnemy(r.g,'elite');r.state='fight';initFight(r.enemy);log(`ศัตรูระดับยอดฝีมือ ${artKey(r.enemy.name)} ขวางทางอยู่!`,'warn');return}
  if(roll<84){
    if(Math.random()<.25){r.enemy=mkEnemy(r.g,'mimic');r.state='fight';initFight(r.enemy);log('หีบสมบัติขยับได้! มันคือมิมิค!','bad');return}
    const gold=Math.round((10+g.lv*4)*rf(1,2.5)*(1+pv('gold')/100));S.gold+=gold;r.loot.gold+=gold;const got=[`ทอง ${gold}`];
    if(Math.random()<.4){S.pot++;got.push('ยาฟื้นพลัง')}if(Math.random()<.2){S.mpot++;got.push('ยามานา')}if(Math.random()<.15){S.spot++;got.push('ยากระตุ้นพลังงาน')}if(Math.random()<.06){S.stone++;got.push('หินปลุกพลังใหม่!')}
    r.state='room';r.obj='chest';r.room={title:'ห้องสมบัติ',text:`คุณพบหีบสมบัติ ได้รับ ${got.join(' · ')}`};log(r.room.text,'ok');return}
  if(roll<92){const h=Math.round(maxHp()*.35),m=Math.round(maxMp()*.35),st=8;S.hp=Math.min(maxHp(),S.hp+h);S.mp=Math.min(maxMp(),S.mp+m);S.sta=Math.min(maxSta(),S.sta+st);
    r.state='room';r.obj='spring';r.room={title:'น้ำพุมานา',text:`น้ำพุเรืองแสงฟื้นฟู HP ${h} · MP ${m} · สตามินา ${st}`};log(r.room.text,'ok');return}
  const avoid=Math.random()*100<dodge()+stat('per')*.5;let text;
  if(avoid)text='คุณสัมผัสได้ถึงกับดักและหลบพ้นได้ทัน';else{const d=Math.round(maxHp()*.12);S.hp=Math.max(1,S.hp-d);S.sta=Math.max(0,S.sta-5);text=`กับดักหนามพุ่งขึ้นจากพื้น คุณเสีย HP ${d} และสตามินา 5`}
  r.state='room';r.room={title:'ห้องกับดัก',text};log(text,avoid?'ok':'bad');
}
function hitEnemy(mult,o={}){
  const r=S.run,e=r.enemy;if(!e||e.hp<=0)return 0;
  let force=o.force;if(!e.fsUsed&&pv('firststrike')){force=true;e.fsUsed=true}
  const c=force||Math.random()*100<crit();
  let base=atk()*mult+(o.bonus||0);if(o.exec&&e.hp/e.max<.3)base*=3;
  if(o.skill)base*=1+pv('skillamp')/100;if(e.boss||e.elite)base*=1+pv('bossdmg')/100;
  const d=Math.max(1,Math.round(base*rf(.9,1.1)*(c?critMul():1)-(o.pierce?0:e.def)));
  e.hp=Math.max(0,e.hp-d);emit({t:'dmg',v:d,crit:c,col:o.col});
  log(`${c?'คริติคอล! ':''}คุณสร้างความเสียหาย ${d}`,c?'crit':'');
  const ls=pv('ls')+(o.drain?o.drain*100:0);if(ls>0)r.lsAcc+=d*ls/100;
  if(e.hp>0&&pv('poisonhit')&&Math.random()*100<pv('poisonhit')){e.burn=Math.max(e.burn,2);log(`${e.name} ติดดาเมจต่อเนื่อง`,'warn')}
  if(e.hp>0&&pv('stunchance')&&!r.stop&&Math.random()*100<pv('stunchance')){r.stop=1;log(`${e.name} ชะงัก!`,'sk')}
  return d;
}
function heal(n,label='ฟื้น HP'){const b=S.hp;S.hp=Math.min(maxHp(),S.hp+Math.round(n*(1+pv('healamp')/100)));const got=S.hp-b;if(got>0){emit({t:'heal',v:got});log(`${label} ${got}`,'ok')}}
function shadowsAttack(mult){
  const e=S.run.enemy;
  S.shadows.forEach((sh,i)=>{if(e.hp<=0)return;const d=Math.max(1,Math.round(shAtk(sh)*mult*rf(.85,1.15)-e.def*.5));e.hp=Math.max(0,e.hp-d);emit({t:'sdmg',i,v:d});log(`${sh.name} โจมตี ${d}`,'sh')});
}
function skillRef(ref){if(ref==='u')return S.awake?{id:'u_'+S.cls,g:'C',ult:1}:null;return S.act[+ref]||null}
function useSkill(ref){
  const r=S.run,e=r.enemy,s=skillRef(ref);if(!s||fatigue()===2)return false;const d=ACT[s.id],cost=mpCost(d);if(S.mp<cost)return false;
  S.mp-=cost;const q=GR[s.g].m,f=d.fx,col=s.ult?glowOf():skillCol(f);
  emit({t:'skill',name:d.n,col});log(`ใช้สกิล${s.ult?'สุดยอด':''} [${d.n}]`,'sk');if(s.ult)A.shake=performance.now();
  if(f.hpcost){const c=Math.round(maxHp()*f.hpcost);S.hp=Math.max(1,S.hp-c);emit({t:'pself',v:c})}
  if(f.heal)heal(maxHp()*f.heal*q);
  if(f.guard)r.guard=Math.max(r.guard,f.guard);
  if(f.evade)r.evade=1;
  if(f.buff){r.buff={v:f.buff*q,t:3};log(`ATK เพิ่มขึ้น ${Math.round(f.buff*q*100)}%`,'sk')}
  if(f.army){if(S.shadows.length)shadowsAttack(f.army*q*(1+pv('skillamp')/100));else{log('ยังไม่มีเงาในกองทัพ พลังเงาระเบิดออกมาแทน','sh');hitEnemy(1.6*q,{pierce:true,col,skill:1})}}
  if(f.m){const hits=f.hits||1;for(let h=0;h<hits&&e.hp>0;h++)hitEnemy(f.m*q,{pierce:f.pierce,force:f.crit,drain:f.drain,exec:f.exec,bonus:f.missing?(maxHp()-S.hp)*f.missing*q:0,col,skill:1})}
  if(e.hp>0){
    if(f.burn){e.burn=Math.max(e.burn,f.burn);log(`${e.name} ได้รับดาเมจต่อเนื่อง ${f.burn} เทิร์น`,'warn')}
    if(f.stun){r.stop=Math.max(r.stop,f.stun);log(`${e.name} ขยับไม่ได้`,'sk')}
    if(f.weak&&!e.weak){e.weak=1;e.atk=Math.round(e.atk*.75);log(`ATK ของ ${e.name} ลดลง`,'sk')}
  }
  return true;
}
function act(arg){
  const r=S.run;if(!r||r.state!=='fight'||ui.busy)return;const e=r.enemy;let shDone=false;EV=[];
  if(arg==='atk'){emit({t:'patk'});hitEnemy(1);
    if(e.hp>0&&pv('extrahit'))hitEnemy(pv('extrahit')/100);
    if(e.hp>0&&pv('double')&&Math.random()*100<pv('double')){log('โจมตีซ้ำ!','sk');hitEnemy(.7)}}
  else if(arg.startsWith('skill:')){const ref=arg.split(':')[1];if(!useSkill(ref))return;const s=skillRef(ref);if(ACT[s.id].fx.army)shDone=true}
  else if(arg==='pot'){if(S.pot<1)return;S.pot--;heal(maxHp()*.5*potMul(),'ดื่มยา ฟื้น HP')}
  else if(arg==='mpot'){if(S.mpot<1)return;S.mpot--;const b=S.mp;S.mp=Math.min(maxMp(),S.mp+Math.round(maxMp()*.6*potMul()));log(`ฟื้น MP ${S.mp-b}`,'ok')}
  else if(arg==='flee'){
    const ch=(e.boss?25:50)+stat('agi')*.5;S.sta=Math.max(0,S.sta-FLEE_STA);
    if(Math.random()*100<ch){S.run=null;sys(`หนีออกจากเกตสำเร็จ (สตามินา -${FLEE_STA}) รางวัลที่ได้ระหว่างทางยังอยู่ครบ`);save();render();return}
    log(`หนีไม่สำเร็จ! เสียสตามินา ${FLEE_STA}`,'bad');shDone=true;
  }
  if(!shDone&&e.hp>0&&S.shadows.length)shadowsAttack(1);
  if(r.lsAcc>=1)heal(r.lsAcc,'ดูดซับ HP');r.lsAcc=0;
  if(e.hp<=0)win();
  else if(arg!=='flee'&&pv('extraturn')&&Math.random()*100<pv('extraturn')){emit({t:'extra'});log('[เวลาเหลื่อม] คุณได้เล่นต่อทันที','sk')}
  else{enemyTurn();if(r.state==='fight'&&e.hp<=0)win()}
  if(r.state!=='dead'){const mr=(1+Math.floor(stat('int')/8)+pv('mpr'))*(r.affix==='mana'?3:1);S.mp=Math.min(maxMp(),S.mp+mr)}
  save();runAnim();
}
function enemyTurn(){
  const r=S.run,e=r.enemy;e.turn++;
  if(e.burn>0){const d=Math.max(1,Math.round(e.max*(e.boss?.03:.05)*(1+pv('burnamp')/100)));e.hp=Math.max(0,e.hp-d);e.burn--;emit({t:'burn',v:d});log(`${e.name} ได้รับดาเมจต่อเนื่อง ${d}`,'warn');if(e.hp<=0)return}
  if(r.stop>0){r.stop--;emit({t:'frozen'});log(`${e.name} ขยับไม่ได้`,'sk')}
  else{
    const heavy=e.boss&&e.turn%3===0;emit({t:'eatk',heavy});
    if(r.evade){r.evade=0;emit({t:'miss'});log(`หลบการโจมตีของ ${e.name} ได้อย่างสมบูรณ์`,'ok')}
    else if(Math.random()*100<dodge()){emit({t:'miss'});log(`คุณหลบการโจมตีของ ${e.name}`,'ok')}
    else{
      let d=Math.max(1,Math.round(e.atk*(heavy?1.9:1)*rf(.85,1.15)-def()));if(r.guard>0)d=Math.max(1,Math.round(d*.25));
      S.hp=Math.max(0,S.hp-d);emit({t:'pdmg',v:d,heavy});log(`${e.name}${heavy?' ปล่อยท่าไม้ตาย!':' โจมตี'} คุณเสีย HP ${d}`,'bad');
      if(pv('thorns')&&e.hp>0){const t=Math.max(1,Math.round(d*pv('thorns')/100));e.hp=Math.max(0,e.hp-t);emit({t:'dmg',v:t,col:'#7fe7ff'});log(`สะท้อนดาเมจ ${t}`,'sk')}
      if(S.hp>0&&e.hp>0&&pv('counter')&&Math.random()*100<pv('counter')){log('สวนกลับ!','sk');hitEnemy(.8)}
    }
    if(r.guard>0)r.guard--;
  }
  if(r.buff&&r.buff.t>0)r.buff.t--;
  if(S.hp>0){const rg=pv('regen');if(rg&&S.hp<maxHp())S.hp=Math.min(maxHp(),S.hp+Math.round(maxHp()*rg/100*(1+pv('healamp')/100)));
    if(r.affix==='mist'){const n=Math.max(1,Math.round(maxHp()*.03));S.hp=Math.max(1,S.hp-n);log(`หมอกพิษกัดกร่อน HP ${n}`,'bad')}}
  if(S.hp<=0){
    if(r.undyingLeft>0){r.undyingLeft--;S.hp=1;emit({t:'undying'});log(`[ปฏิเสธความตาย] คุณลุกขึ้นอีกครั้งด้วย HP 1 (เหลือ ${r.undyingLeft} ครั้ง)`,'sk')}
    else{const lost=Math.floor(S.gold*.3);S.gold-=lost;r.lost=lost;r.state='dead';S.deaths++;S.sta=Math.max(0,S.sta-10);emit({t:'pdie'});log('คุณล้มลง…','bad');return}
  }
  if(e.boss&&e.hp>0&&(e.turn+1)%3===0&&!r.stop)log(`${e.name} กำลังรวบรวมพลัง เทิร์นหน้าจะโจมตีรุนแรง`,'warn');
}
function win(){
  const r=S.run,e=r.enemy,af=AFX[r.affix],g=GATES[r.g];S.kills++;
  const xp=Math.round(e.xp*(1+pv('xp')/100)*(af.xp||1)),gold=Math.round(e.gold*(1+pv('gold')/100)*(af.gold||1));
  emit({t:'kill'});S.gold+=gold;r.loot.xp+=xp;r.loot.gold+=gold;log(`${e.name} ถูกกำจัด +${xp} EXP +${gold} ทอง`,'ok');gainXp(xp);
  if(pv('killheal')){const b=S.hp;S.hp=Math.min(maxHp(),S.hp+Math.round(maxHp()*pv('killheal')/100));if(S.hp>b)log(`ฟื้น HP ${S.hp-b} จากการสังหาร`,'ok')}
  if(pv('killmp')){S.mp=Math.min(maxMp(),S.mp+Math.round(maxMp()*pv('killmp')/100))}
  if(Math.random()<(e.elite?.6:.25)){S.pot++;log('ได้รับ ยาฟื้นพลัง ×1','ok')}
  if(e.boss){S.cleared[r.g]=(S.cleared[r.g]||0)+1;
    if(g.trial){log('[ระบบ] ผ่านบททดสอบแล้ว พลังที่หลับใหลกำลังตื่นขึ้น','sys');r.state='awaken';return}
    if(Math.random()<.08){S.stone++;log('ได้รับ หินปลุกพลังใหม่ ×1!','crit')}
    log('[ระบบ] เคลียร์ดันเจี้ยนแล้ว เกตกำลังจะปิด','sys');r.state=pv('extract')?'arise':'cleared'}

}

  <button class="btn" data-act="act" data-arg="mpot" ${S.mpot&&!ui.busy?'':'disabled'}>ยา MP<small>×${S.mpot}</small></button>
  <button class="btn ghost" data-act="act" data-arg="flee" ${dis}>หนี<small>STA -${FLEE_STA}</small></button>${noSk?'<p class="roomtext warn">คุณหมดแรง ใช้สกิลไม่ได้จนกว่าจะได้พัก</p>':''}`;
 else if(r.state==='won'||r.state==='room')acts=`${r.state==='room'?`<div class="note">${r.room.title}</div><p class="roomtext">${r.room.text}</p>`:`<div class="note">[ระบบ] ห้องนี้ปลอดภัยแล้ว${r.stage===2?' ห้องถัดไปคือห้องบอส':''}</div>`}
  <button class="btn solid" data-act="next" ${dis}>${r.stage===2?'เข้าห้องบอส':'เดินต่อ'}<small>STA -${staCost(ROOM_STA)}</small></button>${quaffBtns}<button class="btn ghost" data-act="leave" ${dis}>ออกจากเกต</button>`;
 else if(r.state==='arise'){const full=S.shadows.length>=maxSh();acts=`<div class="note r-S">ร่างของ ${e.name} ยังคงอยู่… เงาของมันกำลังรอคำสั่ง</div>
  ${full?`<p class="roomtext small">กองทัพเงาเต็มแล้ว (${maxSh()} ตัว) ปลดเงาออกในแท็บกองทัพเงาก่อน หรือปล่อยร่างนี้ไป</p>`:''}
  <button class="btn violet" data-act="arise" ${full||ui.busy?'disabled':''}>ARISE<small>เหลือ ${r.tries}</small></button><button class="btn ghost" data-act="skipArise" ${dis}>ปล่อยไป</button>`}
 else if(r.state==='awaken')acts=`<div class="note" style="color:${c.aw.glow}">พลังที่หลับใหลอยู่ในตัวคุณกำลังตื่นขึ้น…</div><button class="btn solid" data-act="awaken" ${dis}>ตื่นรู้เป็น ${c.aw.name}</button>`;
 else if(r.state==='cleared')acts=`<div class="note">[ระบบ] เคลียร์ ${g.name} รางวัลรวม EXP +${r.loot.xp} · ทอง +${r.loot.gold}</div><button class="btn solid" data-act="leave" ${dis}>กลับเมือง</button>`;
 else if(r.state==='dead')acts=`<div class="note bad">[ระบบ] ผู้เล่นเสียชีวิต ระบบชุบชีวิตคุณให้ แต่ทองหายไป ${r.lost} สตามินา -10 และ HP เหลือ 30%</div><button class="btn solid" data-act="revive" ${dis}>ฟื้นคืนชีพในเมือง</button>`;
 const tags=e&&e.hp>0?[e.burn?`<span class="chip warn">ดาเมจต่อเนื่อง ${e.burn}</span>`:'',r.stop?`<span class="chip cy">ขยับไม่ได้ ${r.stop}</span>`:'',e.weak?'<span class="chip vi">ATK ลดลง</span>':'',r.guard?`<span class="chip">ป้องกัน ${r.guard}</span>`:'',r.buff&&r.buff.t>0?`<span class="chip warn">ATK +${Math.round(r.buff.v*100)}% · ${r.buff.t}</span>`:''].join(''):'';
 return `<section class="battle"><div class="bhead g-${g.r}"><span class="chip">${g.trial?'ภารกิจเปลี่ยนอาชีพ':'เกตแรงก์ '+g.r}</span><b>${g.name}</b>${r.affix!=='none'?`<span class="chip ${af.c}" title="${af.d}">${af.n}</span>`:''}<span class="stage-num">${g.trial?'บททดสอบ':`ห้อง ${r.stage+1}/4${r.stage===3?' · ห้องบอส':''}`}</span></div>
 <div class="stage-wrap win" id="stageSlot"></div>
 ${e&&(r.state==='fight'||e.hp>0)?`<div class="foe win ${e.boss?'boss':''}"><div class="fhead"><span class="eyebrow">${e.boss?'บอส':e.elite?'ยอดฝีมือ':'มอนสเตอร์'} · Lv ${e.lv}</span><span class="fname">${artKey(e.name)}</span>${tags}</div>${bar('HP',e.hp,e.max,'hp')}<div class="fmeta">ATK ${e.atk} · DEF ${e.def}</div></div>`:''}
 <div class="actions">${acts}</div>
 <div class="log win" aria-live="polite">${r.log.slice(-10).reverse().map(l=>`<div class="l ${l.k}">${l.t}</div>`).join('')}</div></section>`}

function render(){
  if(!S||!S.cls)return;
  const views={status:vStatus,daily:vDaily,gates:vGates,shop:vShop,codex:vCodex,shadow:vShadow};
  const app=$('#app');app.innerHTML=header()+(S.run?vBattle():tabs()+(views[ui.tab]||vGates)());
  if(S.run){const slot=$('#stageSlot');if(slot){slot.appendChild(arenaCanvas());ensureArena()}}
  paintCanvases(app);
}

/* ================= ACTIONS ================= */
const H={
  toCreate(){ui.draft={name:'ฮันเตอร์ไร้นาม',look:randomLook(),origin:'student'};drawCreate()},
  look(a){const [k,v]=a.split(':');ui.draft.look[k]=+v;drawCreate()},
  randLook(){ui.draft.look=randomLook();drawCreate()},
  origin(id){ui.draft.origin=id;drawCreate()},
  confirmCreate(){const d=ui.draft;const n=(d.name||'').trim()||'ฮันเตอร์ไร้นาม';S=newState(n,{...d.look},d.origin);rollClass(c=>{assignClass(c);showClass(c,true)})},
  closeModal,
  tab(t){ui.tab=t;ui.confirmReset=false;render()},
  addStat(a){const [k,n]=a.split(':');const m=Math.min(+n,S.pts);if(!m)return;const hpPct=S.hp/maxHp();S.alloc[k]+=m;S.pts-=m;if(k==='vit')S.hp=Math.round(maxHp()*hpPct);save();render()},
  enter,act,next,arise,openPick,awaken,
  choose(i){const o=S.pickOpts&&S.pickOpts[+i];if(!o)return;
    if(o.k==='act'){S.act.push({id:o.id,g:o.g});sys(`ได้รับสกิล [${ACT[o.id].n}] เกรด ${o.g}`,'lv')}
    else if(o.k==='pas'){S.pas.push({id:o.id,g:o.g});sys(`ได้รับสกิลติดตัว [${PAS[o.id].n}] เกรด ${o.g}`,'lv')}
    else{const s=S[o.w][o.i];s.g=nextGrade(s.g);sys(`ยกระดับสกิลเป็นเกรด ${s.g}`,'lv')}
    S.picks--;S.pickOpts=null;save();if(S.picks>0)openPick();else closeModal()},
  skipArise(){S.run.state='cleared';log('คุณปล่อยให้ร่างของบอสสลายไป','sh');save();render()},
  leave(){S.run=null;sys('ออกจากเกตแล้ว');save();render();checkUnlocks()},
  revive(){S.run=null;S.hp=Math.round(maxHp()*.3);S.mp=Math.round(maxMp()*.5);save();render();checkUnlocks()},
  quaff(k){if(ui.busy)return;
    if(k==='pot'&&S.pot){S.pot--;S.hp=Math.min(maxHp(),S.hp+Math.round(maxHp()*.5*potMul()))}
    if(k==='mpot'&&S.mpot){S.mpot--;S.mp=Math.min(maxMp(),S.mp+Math.round(maxMp()*.6*potMul()))}
    if(k==='spot'&&S.spot&&!S.run){S.spot--;S.sta=Math.min(maxSta(),S.sta+40)}
    save();render()},
  train(k){const q=DAILY.find(d=>d[0]===k);if(S.sta<TRAIN_STA||S.daily[k]>=q[2])return;S.sta-=TRAIN_STA;S.daily[k]=Math.min(q[2],S.daily[k]+q[4]);if(dailyDone())sys('ภารกิจรายวันสำเร็จแล้ว รับรางวัลได้');save();render()},
  claim(){if(!dailyDone()||S.daily.claimed)return;S.daily.claimed=true;S.pts+=3;gainXp(20*S.lv);S.hp=maxHp();S.mp=maxMp();S.sta=Math.min(maxSta(),S.sta+20);sys('ได้รับแต้มสถานะ +3 ฟื้นฟูร่างกายเต็ม และสตามินา +20','lv');save();render()},
  doActivity(id){const a=ACTIVITIES.find(x=>x.id===id);if(!a||S.today[id]>=a.max||S.sta<a.cost)return;
    S.sta-=a.cost;S.today[id]++;
    if(id==='train2'){S.pts++;sys('ฝึกพิเศษเสร็จ ได้แต้มสถานะ +1','lv')}
    if(id==='job'){const g=jobGold();S.gold+=g;sys(`ทำงานคุ้มกันเสร็จ ได้ทอง ${g}`)}
    if(id==='nap'){S.sta=Math.min(maxSta(),S.sta+20);sys('งีบพักฟื้น สตามินา +20')}
    save();render()},
  endDay(){
    if(!S.daily.claimed){const lost=Math.floor(S.gold*.2);S.gold-=lost;S.hp=Math.max(S.hp,Math.round(maxHp()*.5));S.mp=Math.max(S.mp,Math.round(maxMp()*.5));S.sta=Math.round(maxSta()*.5);sys(`คุณถูกส่งไปยังโซนลงโทษ… รอดมาได้แต่เสียทอง ${lost} และเหนื่อยล้า สตามินาเหลือครึ่งเดียว`,'bad')}
    else{S.hp=maxHp();S.mp=maxMp();S.sta=maxSta();sys('พักผ่อนเต็มที่ HP, MP และสตามินาฟื้นฟูแล้ว')}
    S.day++;S.daily={push:0,sit:0,squat:0,run:0,claimed:false};S.today=freshToday();save();render()},
  buy(k){const cost={pot:20+S.lv*2,mpot:18+S.lv*2,spot:40+S.lv*2,wpn:(WPN[S.wpn+1]||{}).p,arm:(ARM[S.arm+1]||{}).p,stone:400}[k];if(!cost||S.gold<cost)return;
    if(k==='spot'){if(S.today.spot>=SPOT_PER_DAY)return;S.today.spot++}
    S.gold-=cost;
    if(k==='pot')S.pot++;if(k==='mpot')S.mpot++;if(k==='spot')S.spot++;if(k==='stone')S.stone++;
    if(k==='wpn'){S.wpn++;sys(`ติดตั้ง ${WPN[S.wpn].n} แล้ว`)}if(k==='arm'){S.arm++;S.hp+=ARM[S.arm].h-ARM[S.arm-1].h;sys(`สวมใส่ ${ARM[S.arm].n} แล้ว`)}
    save();render()},
  useStone(){if(!S.stone||S.run)return;S.stone--;save();rollClass(c=>{assignClass(c);showClass(c,false)})},
  switchCls(id){const c=CLASSES.find(x=>x.id===id);if(!c||!S.unlocked.includes(id)||S.run)return;assignClass(c);showClass(c,false)},
  release(i){const sh=S.shadows.splice(+i,1)[0];if(sh)sys(`${sh.name} กลับคืนสู่ความมืด`,'sh');save();render()},
  reset(){if(!ui.confirmReset){ui.confirmReset=true;render();return}try{localStorage.removeItem(KEY)}catch(e){}S=null;ui.confirmReset=false;ui.tab='gates';$('#app').innerHTML='';intro()},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=H[b.dataset.act];f&&f(b.dataset.arg)});
document.addEventListener('input',e=>{if(e.target.id==='hname'&&ui.draft)ui.draft.name=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='hname')H.confirmCreate()});

S=load();
if(S){S.run&&resetArena();render()}else intro();
</script>

</body>
