<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redesign Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<!-- dev-only: redesign proposal for three classes, drawn with the game's own renderer (not part of the build) -->
<style>
  :root { --bg: #0a1324; --panel: #0f1c33; --line: #1f3b63; --text: #d6e9ff; --muted: #7f9bbf; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 'IBM Plex Sans Thai', system-ui, sans-serif; padding: 24px 16px 48px; }
  main { max-width: 1040px; margin: 0 auto; }
  h1 { font: 700 26px 'Chakra Petch', sans-serif; margin: 0 0 4px; }
  h2 { font: 600 19px 'Chakra Petch', sans-serif; margin: 0 0 4px; }
  h3 { font: 600 18px 'IBM Plex Sans Thai', sans-serif; margin: 0 0 12px; color: var(--acc); }
  .muted { color: var(--muted); font-weight: 400; font-size: 14px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .block { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  .row { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .rowlabel { width: 44px; font: 600 14px 'Chakra Petch', sans-serif; color: var(--muted); align-self: center; }
  .stage { background: radial-gradient(circle at 50% 80%, #1b3358, #050913 75%); border-radius: 8px; padding: 14px; margin-top: 8px; }
  figure { margin: 0; display: grid; justify-items: center; gap: 4px; }
  figcaption { font-size: 13px; color: var(--muted); }
  canvas { image-rendering: pixelated; display: block; }
  .card { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; }
  .card:first-of-type { border-top: 0; margin-top: 8px; padding-top: 4px; }
  .figs { display: flex; gap: 16px; flex-wrap: wrap; }
  .grp { display: flex; align-items: flex-end; gap: 18px; padding: 12px 16px; border-radius: 8px; position: relative; background: radial-gradient(circle at 50% 80%, #1b3358, #050913 80%); }
  .grp.new { outline: 2px solid var(--acc); }
  .tag { position: absolute; top: 8px; left: 10px; font: 600 12px 'Chakra Petch', sans-serif; color: var(--muted); }
  .grp.new .tag { color: var(--acc); }
  ul { margin: 12px 0 0; padding-left: 20px; }
  li { margin: 2px 0; }
  @media (max-width: 560px) { .grp { gap: 10px; padding: 10px; } }
</style>
</head>
<body>
<main>
  <h1>ทดลองปรับดีไซน์ 3 อาชีพ</h1>
  <p class="lead">นักรบ · จอมโจร · นักธนู เป็นอาชีพที่สุ่มได้บ่อยที่สุดและดูคล้ายกันที่สุดตอนนี้ วาดด้วยตัววาดของเกมเอง ยังไม่ได้ใส่ในเกมจริง</p>
  <div id="root"></div>
</main>
<script type="module" src="/src/dev/redesign.js"></script>
</body>
</html>
